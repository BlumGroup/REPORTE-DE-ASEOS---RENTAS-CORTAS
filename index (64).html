<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2C2C2C">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BLÜM Aseo">
<title>BLÜM Control de Aseo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de una columna para celular, pasos con barra de acción fija abajo */
:root{
  --bg:#F3F4F1; --card:#FFFFFF; --ink:#2C2C2C; --muted:#6E726B; --line:#DFE2DB;
  --sage:#6B8E6B; --sage-soft:#E4ECE2; --clay:#B08968; --clay-soft:#F2E9E1;
  --bad:#B5483B; --bad-soft:#F6E2DF; --warn:#B9862E; --warn-soft:#F6ECD8;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171917; --card:#222522; --ink:#ECEDEA; --muted:#A3A89F; --line:#353935;
  --sage:#8DB08B; --sage-soft:#26332A; --clay:#C9A483; --clay-soft:#3A2F26;
  --bad:#E07A6C; --bad-soft:#3E2523; --warn:#DDB06A; --warn-soft:#3A3122; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171917; --card:#222522; --ink:#ECEDEA; --muted:#A3A89F; --line:#353935;
  --sage:#8DB08B; --sage-soft:#26332A; --clay:#C9A483; --clay-soft:#3A2F26;
  --bad:#E07A6C; --bad-soft:#3E2523; --warn:#DDB06A; --warn-soft:#3A3122; color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sage);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}

header{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding-top:env(safe-area-inset-top,0px)}
header .in{max-width:560px;margin:0 auto;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:12px}
.brand{font-weight:700;letter-spacing:.14em;font-size:13px}
.brand small{display:block;font-weight:500;letter-spacing:.02em;opacity:.7;font-size:12px}
.apt-tag{margin-left:auto;font-size:12px;background:rgba(255,255,255,.12);padding:4px 10px;border-radius:99px;max-width:55%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps{display:flex;gap:4px;max-width:560px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.steps i{flex:1;height:4px;border-radius:4px;background:rgba(255,255,255,.2)}
.steps i.on{background:var(--sage)}

h1{font-size:22px;line-height:1.2;margin:20px 0 4px;text-wrap:balance}
.lead{color:var(--muted);margin:0 0 16px}
.label{display:block;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.field{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
textarea.field{min-height:90px;resize:vertical}

.banner{margin-top:14px;padding:10px 12px;border-radius:10px;font-size:13px;display:flex;gap:10px;align-items:center}
.banner.demo{background:var(--clay-soft);color:var(--ink)}
.banner.pend{background:var(--warn-soft)}
.banner button{margin-left:auto;border:0;background:var(--ink);color:var(--bg);padding:6px 12px;border-radius:8px;font-weight:600;font-size:13px}

.apts{display:grid;gap:8px}
.apt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:14px;border:1.5px solid var(--line);border-radius:14px;background:var(--card)}
.apt b{display:block}
.apt span{font-size:13px;color:var(--muted)}
.apt[aria-pressed="true"]{border-color:var(--sage);background:var(--sage-soft)}
.radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
[aria-pressed="true"] .radio{border-color:var(--sage);background:var(--sage)}
[aria-pressed="true"] .radio::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--card)}

.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{border:0;background:none;padding:10px 4px;border-radius:10px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* Aseo */
.area{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:10px}
.area+.area{margin-top:10px}
.area-h{display:flex;align-items:center;gap:10px}
.area-h b{flex:1;min-width:0}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--line);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--sage-soft);color:var(--sage)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.thumb{position:relative;flex:none;width:72px;height:72px;border-radius:10px;overflow:hidden;background:var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:14px;line-height:1}
.cam{flex:none;width:72px;height:72px;border-radius:10px;border:1.5px dashed var(--sage);background:var(--sage-soft);color:var(--sage);font-size:12px;font-weight:600;display:grid;place-items:center;gap:0;padding:6px}
.cam svg{width:22px;height:22px}
.hint{font-size:12px;color:var(--muted)}

/* Inventario */
.inv-area{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.inv-area+.inv-area{margin-top:10px}
.inv-head{display:flex;align-items:center;gap:10px;padding:12px;border-bottom:1px solid var(--line)}
.inv-head b{flex:1}
.btn-ver{border:1.5px solid var(--sage);background:none;color:var(--sage);font-weight:600;font-size:13px;padding:7px 12px;border-radius:10px}
.btn-ver[aria-pressed="true"]{background:var(--sage);color:var(--card)}
.item{padding:10px 12px;display:grid;gap:8px}
.item+.item{border-top:1px solid var(--line)}
.item-r{display:flex;align-items:center;gap:10px}
.item-r .nm{flex:1;min-width:0}
.item-r .qty{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.st{border:0;font-size:13px;font-weight:600;padding:7px 10px;border-radius:9px;min-width:84px}
.st.ok{background:var(--sage-soft);color:var(--sage)}
.st.falta{background:var(--warn-soft);color:var(--warn)}
.st.danado{background:var(--bad-soft);color:var(--bad)}
.detail{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.step button{border:0;background:var(--bg);width:36px;height:36px;font-size:18px}
.step output{min-width:56px;text-align:center;font-variant-numeric:tabular-nums;font-size:13px}
.detail input[type=text]{flex:1;min-width:140px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.mini-cam{border:1px dashed var(--line);background:none;border-radius:10px;padding:8px 10px;font-size:13px;color:var(--muted)}
.mini-cam.has{border-style:solid;border-color:var(--sage);color:var(--sage)}

.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.person{padding:14px 12px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);font-weight:600;text-align:left}
.person[aria-pressed="true"]{border-color:var(--sage);background:var(--sage);color:#fff}
.yn{display:flex;gap:6px;flex:none}
.yn button{border:1.5px solid var(--line);background:var(--card);font-weight:700;width:58px;padding:9px 0;border-radius:10px}
.yn .si[aria-pressed="true"]{background:var(--sage);border-color:var(--sage);color:#fff}
.yn .no[aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:#fff}
.item.done{background:color-mix(in srgb,var(--sage-soft) 55%,transparent)}
.mini-cam svg{width:18px;height:18px;vertical-align:-4px;margin-right:4px}
.mini-cam.need{border:1.5px solid var(--sage);background:var(--sage-soft);color:var(--sage);font-weight:600;padding:10px 14px}
.detail .thumb{width:56px;height:56px}
.prog{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.prog-bar{flex:1;height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.prog-bar i{display:block;height:100%;width:0;background:var(--sage);transition:width .25s}

/* Cierre */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 13px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--clay);border-color:var(--clay);color:#fff}
.sum{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 14px}
.sum div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;font-size:14px}
.sum div+div{border-top:1px solid var(--line)}
.sum span{color:var(--muted)}
.sum b{text-align:right;font-variant-numeric:tabular-nums}

/* Barra inferior */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bar .in{max-width:560px;margin:0 auto;display:flex;gap:10px;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.btn{flex:1;border:0;border-radius:14px;padding:15px;font-weight:700;font-size:16px}
.btn.pri{background:var(--sage);color:#fff}
.btn.pri:disabled{opacity:.45}
.btn.sec{flex:0 0 auto;background:var(--bg);border:1px solid var(--line);padding-inline:18px}
.err{color:var(--bad);font-size:13px;margin-top:8px}

/* Hecho */
.done{text-align:center;padding-top:40px}
.done .ico{width:72px;height:72px;margin:0 auto 12px;border-radius:50%;background:var(--sage-soft);color:var(--sage);display:grid;place-items:center}
.hist{text-align:left;margin-top:24px}
.hist li{list-style:none;padding:10px 0;border-top:1px solid var(--line);display:flex;gap:10px;font-size:14px}
.hist ul{padding:0;margin:0}
.hist li span{color:var(--muted);margin-left:auto;white-space:nowrap}
.spin{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;display:inline-block;vertical-align:-3px;animation:r .8s linear infinite;margin-right:8px}
@keyframes r{to{transform:rotate(1turn)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
<header>
  <div class="in">
    <div class="brand">BLÜM<small>Control de aseo</small></div>
    <div class="apt-tag" id="aptTag" hidden></div>
  </div>
  <div class="steps" id="steps"></div>
</header>

<main class="wrap">
  <div id="banners"></div>

  <section id="v-inicio">
    <h1>Registro de aseo</h1>
    <p class="lead">Toca tu nombre y el apartamento.</p>
    <span class="label">¿Quién hace el aseo?</span>
    <div class="people" id="people"></div>
    <span class="label">Apartamento</span>
    <div class="apts" id="apts"></div>
  </section>

  <section id="v-aseo" hidden>
    <h1>Fotos por zona</h1>
    <p class="lead">Toma una foto de cada zona como quedó. Si no sale bien, toca “Repetir”.</p>
    <div class="prog"><div class="prog-bar"><i id="bar"></i></div><span id="prog"></span></div>
    <div id="areas"></div>
    <label class="label" for="notas">Observaciones (opcional)</label>
    <textarea class="field" id="notas" placeholder="Ej: la ducha gotea, falta papel higiénico…"></textarea>
    <div class="err" id="sendErr" hidden></div>
  </section>

  <section id="v-ok" hidden>
    <div class="done">
      <div class="ico"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <h1 id="okTitle">Aseo registrado</h1>
      <p class="lead" id="okMsg"></p>
    </div>
  </section>
</main>

<div class="bar"><div class="in">
  <button class="btn sec" id="back" type="button" hidden>Atrás</button>
  <button class="btn pri" id="next" type="button">Empezar</button>
</div></div>

<input type="file" id="camIn" accept="image/*" capture="environment" hidden>

<script>
/* Pega aquí la URL /exec de Apps Script. Vacío = modo demo. */
const API_URL = "https://script.google.com/macros/s/AKfycbySnN_2W88OUAEI61JBZ7ZLu0vVmHUkWtS9EIdvL8L5Yu75amD2rydB-5w3uEYtiRQIvA/exec";

const DEMO = {
  colaboradoras: ["Colaboradora 1 (ejemplo)","Colaboradora 2 (ejemplo)"],
  apartamentos: [
    {id:"GP706", nombre:"Grand Plaza 85 · 706 (ejemplo)", areas:["Sala-comedor","Cocina","Habitación","Baño","Balcón"]},
    {id:"CA102", nombre:"Caminos de Alcázar · 102 (ejemplo)", areas:["Sala","Cocina","Habitación 1","Habitación 2","Baño"]}
  ]
};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ls = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch(e){ return false; } }
};
const CAM_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>';

let CFG, paso = "inicio";
const S = { id:"A"+Date.now().toString(36).toUpperCase(), cleaner:ls.get("blum_cleaner",""), aptId:null, inicio:null, areas:{} };
const apt = () => CFG.apartamentos.find(a=>a.id===S.aptId);

async function cargarConfig(){
  if(!API_URL){ CFG=DEMO; $("#banners").innerHTML='<div class="banner demo">Modo demo con datos de ejemplo.</div>'; return; }
  try{
    const j = await (await fetch(API_URL+"?action=config")).json();
    if(!j.ok) throw 0; CFG=j.data; ls.set("blum_cfg",CFG);
  }catch(e){
    CFG = ls.get("blum_cfg",{colaboradoras:[],apartamentos:[]});
    $("#banners").innerHTML='<div class="banner pend">Sin conexión: usando la última lista guardada.</div>';
  }
}

/* Foto comprimida con sello de apto y hora */
function procesarFoto(file){
  return new Promise((res,rej)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{
      const s=Math.min(1,1000/Math.max(img.width,img.height));
      const c=document.createElement("canvas"); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
      const x=c.getContext("2d"); x.drawImage(img,0,0,c.width,c.height);
      const fs=Math.max(14,Math.round(c.width/45));
      x.font=`600 ${fs}px sans-serif`; x.fillStyle="rgba(0,0,0,.55)"; x.fillRect(0,c.height-fs*1.9,c.width,fs*1.9);
      x.fillStyle="#fff"; x.fillText(`${apt()?.nombre||""} · ${new Date().toLocaleString("es-CO")}`, fs*.6, c.height-fs*.6);
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg",0.72));
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(); };
    img.src=url;
  });
}
let camArea=null;
$("#camIn").addEventListener("change", async e=>{
  const f=e.target.files[0]; if(f){ try{ S.areas[camArea]=[await procesarFoto(f)]; }catch(err){} }
  render();
});

function render(){
  ["inicio","aseo","ok"].forEach(v=>$("#v-"+v).hidden = v!==paso);
  $("#steps").innerHTML = paso==="ok" ? "" : `<i class="on"></i><i class="${paso==="aseo"?"on":""}"></i>`;
  $("#aptTag").hidden = paso!=="aseo"; if(S.aptId) $("#aptTag").textContent=apt().nombre;
  $("#back").hidden = paso!=="aseo";
  const next=$("#next");
  if(paso==="inicio"){
    const ppl=CFG.colaboradoras||[]; if(!ppl.includes(S.cleaner)) S.cleaner="";
    $("#people").innerHTML = ppl.map(n=>`<button type="button" class="person" aria-pressed="${n===S.cleaner}">${esc(n)}</button>`).join("") || '<p class="hint">No hay colaboradoras cargadas.</p>';
    $("#apts").innerHTML = CFG.apartamentos.map(a=>`<button type="button" class="apt" data-id="${esc(a.id)}" aria-pressed="${a.id===S.aptId}"><span class="radio"></span><div><b>${esc(a.nombre)}</b><span>${a.areas.length} zonas</span></div></button>`).join("") || '<p class="hint">No hay apartamentos cargados.</p>';
    next.disabled = !(S.cleaner && S.aptId); next.textContent="Empezar";
  }
  if(paso==="aseo"){
    const zonas=apt().areas, hechas=zonas.filter(z=>(S.areas[z]||[]).length).length;
    $("#prog").textContent=`${hechas} de ${zonas.length}`; $("#bar").style.width=(hechas/zonas.length*100)+"%";
    $("#areas").innerHTML = zonas.map((z,i)=>{ const f=S.areas[z]||[];
      return `<div class="area"><div class="area-h"><b>${esc(z)}</b><span class="pill ${f.length?"ok":""}">${f.length?"✓ Lista":"Pendiente"}</span></div>
      <div class="thumbs"><button type="button" class="cam" data-i="${i}">${CAM_SVG}${f.length?"Repetir":"Foto"}</button>
      ${f.map((src,j)=>`<div class="thumb"><img src="${src}" alt="Foto ${j+1} de ${esc(z)}"><button type="button" aria-label="Quitar foto" data-del="${i}:${j}">×</button></div>`).join("")}</div></div>`;}).join("");
    const falta=zonas.length-hechas;
    next.disabled = falta>0; next.textContent = falta ? `Faltan ${falta} zona${falta>1?"s":""} con foto` : "Enviar";
  }
}

$("#people").addEventListener("click", e=>{ const b=e.target.closest(".person"); if(b){ S.cleaner=b.textContent; render(); }});
$("#apts").addEventListener("click", e=>{ const b=e.target.closest(".apt"); if(b){ if(S.aptId!==b.dataset.id){ S.aptId=b.dataset.id; S.areas={}; } render(); }});
$("#areas").addEventListener("click", e=>{
  const zonas=apt().areas, c=e.target.closest(".cam");
  if(c){ camArea=zonas[+c.dataset.i]; const i=$("#camIn"); i.value=""; i.click(); return; }
  const d=e.target.closest("[data-del]");
  if(d){ const [i,j]=d.dataset.del.split(":").map(Number); S.areas[zonas[i]].splice(j,1); render(); }
});
$("#back").onclick=()=>{ paso="inicio"; render(); scrollTo(0,0); };
$("#next").onclick=async ()=>{
  if(paso==="ok"){ location.reload(); return; }
  if(paso==="inicio"){ ls.set("blum_cleaner",S.cleaner); if(!S.inicio) S.inicio=new Date().toISOString(); paso="aseo"; render(); scrollTo(0,0); return; }
  await enviar();
};

async function post(p){
  if(!API_URL){ await new Promise(r=>setTimeout(r,800)); return {ok:true,demo:true}; }
  const j = await (await fetch(API_URL,{method:"POST",body:JSON.stringify(p)})).json();
  if(!j.ok) throw new Error(j.error); return j;
}
async function enviar(){
  const next=$("#next"), err=$("#sendErr"); err.hidden=true;
  next.disabled=true; next.innerHTML='<span class="spin"></span>Enviando…';
  const a=apt();
  const p={ modulo:"aseo", id:S.id, aseadora:S.cleaner, aptId:a.id, apartamento:a.nombre, inicio:S.inicio, fin:new Date().toISOString(),
    areas:a.areas.map(z=>({area:z, fotos:S.areas[z]||[]})), notas:$("#notas").value.trim() };
  let msg;
  try{
    const r=await post(p);
    msg = r.demo ? "Modo demo: no se guardó en la hoja." : "Quedó registrado con sus fotos.";
  }catch(e){
    const pend=ls.get("blum_pend_aseo",[]); pend.push(p);
    if(!ls.set("blum_pend_aseo",pend)){
      err.textContent="No hay conexión. Busca señal o wifi y toca Enviar de nuevo.";
      err.hidden=false; next.disabled=false; next.textContent="Enviar"; return;
    }
    $("#okTitle").textContent="Guardado en el celular";
    msg="No hubo conexión. Se envía solo la próxima vez que abras la app con internet.";
  }
  $("#okMsg").textContent=msg; paso="ok"; render();
  next.disabled=false; next.textContent="Nuevo registro"; scrollTo(0,0);
}
async function reenviarPendientes(){
  const pend=ls.get("blum_pend_aseo",[]); if(!pend.length || !API_URL) return;
  const quedan=[]; for(const p of pend){ try{ await post(p); }catch(e){ quedan.push(p); } }
  ls.set("blum_pend_aseo",quedan);
}

(async()=>{ await cargarConfig(); render(); reenviarPendientes(); })();
</script>
